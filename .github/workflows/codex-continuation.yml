name: Codex continuation

on:
  push:
    branches: [develop, main]
    paths:
      - system/scripts/codex_continuation.py
      - tests/test_codex_continuation.py
      - docs/codex-continuation.md
      - system/skills/boi-delegation/SKILL.md
      - .github/workflows/codex-continuation.yml
  pull_request:
    paths:
      - system/scripts/codex_continuation.py
      - tests/test_codex_continuation.py
      - docs/codex-continuation.md
      - system/skills/boi-delegation/SKILL.md
      - .github/workflows/codex-continuation.yml

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python3 -m unittest discover -s tests -p test_codex_continuation.py
