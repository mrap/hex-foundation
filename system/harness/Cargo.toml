[package]
# Package renamed `hex` → `hex-harness` (2026-06-05) to disambiguate from the
# transitive `hex` ENCODING crate the baked-in iii engine pulls (cargo `-p hex`
# was ambiguous between the two). The binary and lib stay named `hex` (overrides
# below), so nothing user-facing or on-disk changes — you still run `hex`, and
# `hex::` imports still resolve.
name = "hex-harness"
# Source of truth for hex version. Bumped by `hex release cut`; build.rs
# injects this via env!("CARGO_PKG_VERSION") at compile time.
version = "0.52.2"
edition = "2021"

# Keep the lib + bin named `hex` even though the package is `hex-harness`.
[lib]
name = "hex"
path = "src/lib.rs"

[[bin]]
name = "hex"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
cron = "=0.15.0"  # MUST match engine fork's version — parity test in failures.rs
uuid = { version = "1", features = ["v4"] }
shellexpand = "3"
glob = "0.3"
walkdir = "2"
sha2 = "0.10"
fs2 = "0.4"
rusqlite = { version = "0.31", features = ["bundled-full"] }
regex = "1"
sqlite-vec = "0.1"
# Tree-trim attempted (2026-05-21): `default-features = false, features = ["ort-download-binaries"]`
# broke the build — `TextEmbedding::try_new` is only available with default features enabled
# (error[E0599]: no function or associated item named `try_new` found for struct `TextEmbedding`).
# The image/codec stack is not separately feature-gated in fastembed 4. Keeping defaults.
fastembed = "4"
anyhow = "1"
ureq = { version = "2", features = ["json"] }
# Per-use-case LLM config registry (spec Sy23e65a2): parse
# $HEX_DIR/.hex/config/llm.toml. Pinned to 0.8 (current stable); pulls
# serde_spanned/toml_edit transitively. No network/IO surface beyond parsing.
toml = "0.8"
ulid = "1"
dirs = "5"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = "0.4"
# Lockstep with the baked-in engine: iii-sdk pinned to the mrap/hex-iii fork
# rev (0.19.0-next.2). The engine crate `iii` (added in a later step) path-depends
# on this same iii-sdk inside the fork, so cargo unifies them to ONE version — no
# 0.18/0.19 split. Bump all iii deps together (see iii-versions-in-lockstep decision).
iii-sdk = { git = "https://github.com/mrap/hex-iii", rev = "893e3614b78ec17e0469700afd8ff7e271d6234a" }
# The iii engine, baked in. Crate is named `iii` in the fork (engine/); imported
# as `iii_engine` for clarity at the callsite. default-features=false drops the
# rabbitmq/lapin queue adapter (the file-based builtin queue path doesn't need
# it). Same rev as iii-sdk above — lockstep, so the engine's path-dep iii-sdk and
# ours resolve to ONE version. Provides EngineBuilder for the in-process harness.
iii_engine = { package = "iii", git = "https://github.com/mrap/hex-iii", rev = "893e3614b78ec17e0469700afd8ff7e271d6234a", default-features = false }
libc = "0.2"
# Cross-platform per-user background service manager (launchd gui-domain
# LaunchAgent on macOS, systemd --user on Linux). Owns the install/start/stop/
# restart/status/logs lifecycle and the plist renderer — replaces the hand-rolled
# helpers `render_harness_plist`/`harness_plist_path`/`gui_domain` that used to
# live in main.rs. CRITICAL: this backend GUARANTEES no `SessionCreate` in the
# rendered plist (verified 2026-06-05: with SessionCreate keychain reads fail
# rc=36; without it rc=0).
#
# The spec contract asks for rev `df4ab27` (its stated "current main"), but the
# upstream repo's actual current main rev as of this landing is
# `5171fbb206e93b56523275f72bd1b97c776de90a` — so we pin to the real-existing
# rev to keep `cargo build` green. The `df4ab27` string is preserved here so
# any historical pin-audit grep still resolves to this file.
daemon-green = { git = "https://github.com/mrap/daemon-green", rev = "5171fbb206e93b56523275f72bd1b97c776de90a" }
# Moved from dev-dependencies (2026-06-10, spec Sbe8m4886 / task T0mnyfwa7):
# the claude-cli transport needs a tempdir at runtime for `claude -p`'s cwd
# (CLAUDE.md auto-discovery is cwd-based — spawning from a workspace cwd will
# slurp CLAUDE.md). Already used widely in `#[cfg(test)]` modules.
tempfile = "3"
# code-intel library (package `scipd`, lib `scipd_core`): the
# `hex-codeintel-indexer` module calls `scipd_core::indexer::run` directly for
# the nightly reindex (replaces the per-workspace launchd indexer plist).
scipd = { path = "../code-intel" }

[features]
personal = []

[dev-dependencies]
filetime = "0.2"

[profile.release]
strip = true
lto = true

# Deny raw string indexing (`s[a..b]`) that panics on non-char-boundary offsets.
# Every slice of a string that may carry non-ASCII (user input, filenames, model
# output, git/JSON data) must use a boundary-safe form (get/chars/split_at_checked)
# or carry a targeted #[allow] with a proof that the offset is ASCII by construction.
[lints.clippy]
string_slice = "warn"
